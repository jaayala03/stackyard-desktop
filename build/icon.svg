<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Stackyard: three stacked layers (web, PHP, database) with a status light -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0b4f4b"/>
    </linearGradient>
    <linearGradient id="web" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f5f1"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>

  <!-- database layer -->
  <path d="M64 74 L104 94 L64 114 L24 94 Z" fill="#f59e0b"/>
  <path d="M24 94 L24 99 L64 119 L104 99 L104 94 L64 114 Z" fill="#b45309"/>
  <!-- PHP layer -->
  <path d="M64 52 L104 72 L64 92 L24 72 Z" fill="#8b8fd6"/>
  <path d="M24 72 L24 77 L64 97 L104 77 L104 72 L64 92 Z" fill="#5a5ea8"/>
  <!-- web layer -->
  <path d="M64 30 L104 50 L64 70 L24 50 Z" fill="url(#web)"/>
  <path d="M24 50 L24 55 L64 75 L104 55 L104 50 L64 70 Z" fill="#9fd9d1"/>
  <!-- </> on the top layer -->
  <g fill="none" stroke="#0f766e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 44 L44 50 L52 56"/>
    <path d="M76 44 L84 50 L76 56"/>
    <path d="M67 41 L61 59"/>
  </g>

  <!-- status light -->
  <circle cx="101" cy="27" r="11" fill="#0b4f4b"/>
  <circle cx="101" cy="27" r="8" fill="#4ade80"/>
</svg>
