appId: com.jaayala03.stackyard
productName: Stackyard
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: LICENSE
    to: docs/LICENSE
  - from: TERMS.md
    to: docs/TERMS.md
  - from: TERMINOS.md
    to: docs/TERMINOS.md
asarUnpack:
  - node_modules/@lydell/**
win:
  target: nsis
  icon: build/icon.png
nsis:
  license: build/LICENSE.txt
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: [AppImage, deb]
  category: Development
