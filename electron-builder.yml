appId: com.jaayala03.stackyard
productName: Stackyard
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: LICENSE
    to: docs/LICENSE
  - from: TERMS.md
    to: docs/TERMS.md
  - from: TERMINOS.md
    to: docs/TERMINOS.md
asarUnpack:
  - node_modules/@lydell/**
win:
  target: nsis
  icon: build/icon.png
nsis:
  license: build/LICENSE.txt
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  identity: null
  category: public.app-category.developer-tools
linux:
  syncDesktopName: true
  target: [AppImage, deb]
  maintainer: Jonathan Ayala <jaayala03@users.noreply.github.com>
  synopsis: Local web development environments powered by DDEV
  category: Development
