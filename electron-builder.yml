appId: com.jaayala03.stackyard
productName: Stackyard
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/@lydell/**
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: [AppImage, deb]
  category: Development
